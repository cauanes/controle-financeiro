name: cacau-finance
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - finance_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance"]
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - finance_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 15
  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "python -m app.migrate && python -m app.setup_runtime"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/finance
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment: &runtime_env
      DATABASE_URL: postgresql://finance_runtime:${APP_DB_PASSWORD}@db:5432/finance
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      TRANSCRIPTION_URL: ${TRANSCRIPTION_URL:-}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - finance_uploads:/data/uploads
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - default
      - cacauweb-net
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.workers.runner"]
    environment: *runtime_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - finance_uploads:/data/uploads
    networks:
      - default
      - cacauweb-net
  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

volumes:
  finance_postgres:
  finance_redis:
  finance_uploads:

networks:
  cacauweb-net:
    external: true
    name: cacauweb-net
