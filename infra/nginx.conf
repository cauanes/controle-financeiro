server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 22m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_host api;

    location /api/ { proxy_pass http://$api_host:8000$request_uri; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /webhooks/ { proxy_pass http://$api_host:8000$request_uri; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /health/ { proxy_pass http://$api_host:8000$request_uri; }
    location / { try_files $uri $uri/ /index.html; }
}
